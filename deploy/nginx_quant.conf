# =========================================================================
# 1. 域名阻断 Server Block (针对 gl685.art / www.gl685.art)
# 作用: 工信部管局备案审核期合规阻断。未备案域名在公网访问时直接丢弃连接 (444)，
#       对外严格呈现为“网站无法打开/连接被重置”，符合管局“未备案严禁上线”的铁律，
#       同时彻底隐藏任何量化、股票、交易等敏感金融内容。
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gl685.art www.gl685.art *.gl685.art;

    ssl_certificate /etc/nginx/ssl/gl685.art_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/gl685.art.key;

    # 丢弃连接，不向审核探针或公众返回任何 HTTP 响应
    return 444;
}

# =========================================================================
# 2. 原业务 Server Block (仅通过 IP 81.70.51.173 与本地回环访问)
# 作用: 保持量化系统、CLIProxyAPI、Warframe 在服务器内部及 IP 直连时正常工作
# =========================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate /etc/nginx/ssl/gl685.art_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/gl685.art.key;
    add_header Strict-Transport-Security "max-age=0" always;
    server_name 81.70.51.173 localhost 127.0.0.1 _;

    client_max_body_size 50M;

    # 静态图标与探针加速（消除 404，不回源 Python 进程）
    location = /favicon.ico {
        alias /opt/ths-trading-ai/static/favicon.ico;
        expires 30d;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
        access_log off;
        log_not_found off;
    }

    # CLIProxyAPI (CPA) Management Panel & API Gateway
    location = /management.html {
        proxy_pass http://127.0.0.1:8317/management.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(v0|v8|v1|v1beta)(/|$) {
        proxy_pass http://127.0.0.1:8317;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Warframe Armory (Client-side SPA, 100% visitor browser compute)
    location /warframe/ {
        alias /var/www/warframe/;
        index index.html;
    }

    location /static {
        alias /opt/ths-trading-ai/static;
        expires 7d;
    }

    # 驾驶舱与通知 SSE 流式长连接专用路由（彻底关闭代理缓冲，86400s 超长保活）
    location ~* ^/api/(stream|notifications/stream|decision_stream) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 8088;
    server_name 81.70.51.173 localhost 127.0.0.1 _;
    root /var/www/warframe;
    index index.html;

    location / {
    }

    location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
